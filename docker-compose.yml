version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: raven_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raven}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raven_password}
      POSTGRES_DB: ${POSTGRES_DB:-raven_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raven}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raven_network

  redis:
    image: redis:7-alpine
    container_name: raven_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raven_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raven_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-raven}:${POSTGRES_PASSWORD:-raven_password}@postgres:5432/${POSTGRES_DB:-raven_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-this-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      DEBUG: ${DEBUG:-True}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - raven_network

volumes:
  postgres_data:
  redis_data:

networks:
  raven_network:
    driver: bridge
